<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Free Roam Bus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600&display=swap">
<style>
/* Layout: full-screen 3D view, transit-sign HUD panels, thumb pads along the bottom edge. */
:root{
  --bg:#0f1417; --panel:rgba(9,72,56,.9); --edge:rgba(255,255,255,.6);
  --ink:#f4f7f2; --amber:#f2a900; --amber-ink:#2a1d00;
  --btn:rgba(16,22,26,.58); --btn-edge:rgba(255,255,255,.55); --map:#1d2429;
  --f-num:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-ui:"Barlow",system-ui,sans-serif;
  --k:clamp(60px,19vw,84px);
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  --gt:calc(env(safe-area-inset-top,0px) + 12px);
  --gb:calc(env(safe-area-inset-bottom,0px) + 16px);
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:var(--f-ui);-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent}
#view{position:fixed;inset:0;width:100%;height:100%;display:block}
.sign{background:var(--panel);border:2px solid var(--edge);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
small{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
#speed{position:fixed;left:var(--gl);top:var(--gt);display:flex;align-items:center;gap:10px;padding:6px 10px 6px 12px}
#speed .num{font:700 50px/1 var(--f-num);font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
#speed .col{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#gear{font:700 20px/1 var(--f-num);background:var(--amber);color:var(--amber-ink);border-radius:5px;padding:3px 8px}
#fare{position:fixed;left:var(--gl);top:calc(var(--gt) + 74px);padding:7px 12px;display:grid;grid-template-columns:auto auto;gap:2px 16px}
#fare .v{font:700 26px/1.05 var(--f-num);font-variant-numeric:tabular-nums}
#fare .nx{grid-column:1/3;border-top:1px solid rgba(255,255,255,.3);padding-top:5px;margin-top:3px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
#fare .nx b{font:700 18px/1 var(--f-num);font-variant-numeric:tabular-nums;color:#ffd466}
#side{position:fixed;right:var(--gr);top:var(--gt);display:flex;flex-direction:column;gap:7px;width:112px}
#mini{width:112px;height:112px;background:var(--map);border:2px solid var(--edge);border-radius:10px;display:block;box-sizing:border-box}
.tb{height:34px;border-radius:8px;border:2px solid var(--btn-edge);background:var(--btn);color:var(--ink);font:600 12px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;padding:0}
.tb:active,.tb.down{background:var(--amber);color:var(--amber-ink)}
#toast{position:fixed;left:50%;top:calc(var(--gt) + 150px);transform:translate(-50%,-8px);opacity:0;transition:opacity .2s,transform .2s;
  padding:8px 16px;font:700 22px/1.1 var(--f-num);letter-spacing:.02em;white-space:nowrap;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
.pad{position:fixed;bottom:var(--gb);display:flex;align-items:flex-end;gap:8px}
#padL{left:var(--gl)} #padR{right:var(--gr)}
.pb{display:flex;align-items:center;justify-content:center;border:2px solid var(--btn-edge);background:var(--btn);color:var(--ink);
  border-radius:18px;font:700 17px var(--f-num);letter-spacing:.1em;text-transform:uppercase;padding:0;touch-action:none}
.pb.down{background:var(--amber);color:var(--amber-ink);border-color:#ffe29a}
.pb svg{width:44%;height:44%;fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.steer{width:var(--k);height:var(--k)}
.gas{width:calc(var(--k)*1.05);height:calc(var(--k)*1.75)}
.brake{width:calc(var(--k)*.92);height:calc(var(--k)*1.2)}
.horn{width:calc(var(--k)*.92);height:calc(var(--k)*.6);border-radius:999px;font-size:14px}
.stack{display:flex;flex-direction:column;gap:8px}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,14,16,.7);
  padding:var(--gt) var(--gr) var(--gb) var(--gl);box-sizing:border-box}
.overlay[hidden]{display:none}
.card{max-width:340px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.card h1{margin:0;font:700 46px/.95 var(--f-num);text-transform:uppercase;letter-spacing:.01em}
.card p{margin:0;font-size:15px;line-height:1.4}
.card ul{margin:0;padding-left:18px;font-size:14px;line-height:1.45}
.go{height:52px;border-radius:10px;border:0;background:var(--amber);color:var(--amber-ink);font:700 22px var(--f-num);letter-spacing:.06em;text-transform:uppercase}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (max-height:430px){#fare,#toast{display:none}.gas{height:calc(var(--k)*1.4)}.brake{height:calc(var(--k)*1)}}
</style>
</head>
<body>

<canvas id="view"></canvas>
<div id="speed" class="sign"><div class="num" id="spd">0</div><div class="col"><small>km/h</small><span id="gear">N</span></div></div>
<div id="fare" class="sign">
  <div><small>Passengers</small><div class="v" id="pax">0</div></div>
  <div><small>Fare Rs</small><div class="v" id="rs">0</div></div>
  <div class="nx"><small>Next stop</small><b id="nx">--</b></div>
</div>
<div id="side">
  <canvas id="mini" width="224" height="224"></canvas>
  <button class="tb" id="bView" type="button">View: Chase</button>
  <button class="tb" id="bSnd" type="button">Sound: On</button>
  <button class="tb" id="bRst" type="button">Back on road</button>
</div>
<div id="toast" class="sign"></div>

<div id="padL" class="pad">
  <button class="pb steer" data-k="left" type="button" aria-label="Steer left"><svg viewBox="0 0 40 40"><path d="M25 7 L11 20 L25 33"/></svg></button>
  <button class="pb steer" data-k="right" type="button" aria-label="Steer right"><svg viewBox="0 0 40 40"><path d="M15 7 L29 20 L15 33"/></svg></button>
</div>
<div id="padR" class="pad">
  <div class="stack">
    <button class="pb horn" data-k="horn" type="button">Horn</button>
    <button class="pb brake" data-k="brake" type="button">Brake</button>
  </div>
  <button class="pb gas" data-k="gas" type="button">Gas</button>
</div>

<div id="start" class="overlay">
  <div class="card sign">
    <h1>Free Roam<br>Bus</h1>
    <p>Drive anywhere in the city. No timer, no rules.</p>
    <ul>
      <li>Hold <b>Gas</b> to go, <b>Brake</b> to stop, then hold it to reverse.</li>
      <li>Slow down inside a glowing amber ring to pick up passengers.</li>
      <li>Stuck on a corner? Tap <b>Back on road</b>.</li>
    </ul>
    <button class="go" id="goBtn" type="button">Start driving</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const N=10,B=70,R=18,HALF=N*B/2,PAD=52;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
let seed=2026;const rand=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const renderer=new THREE.WebGLRenderer({canvas:$('view'),antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
const scene=new THREE.Scene();
const HORIZON=0xe9c4a2;
(function(){const c=document.createElement('canvas');c.width=4;c.height=256;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#5f93cc');gr.addColorStop(.55,'#e9c4a2');gr.addColorStop(1,'#e9c4a2');
  g.fillStyle=gr;g.fillRect(0,0,4,256);scene.background=new THREE.CanvasTexture(c);})();
scene.fog=new THREE.Fog(HORIZON,110,480);
const camera=new THREE.PerspectiveCamera(62,1,0.5,900);
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();

scene.add(new THREE.HemisphereLight(0xfff0dc,0x6a6e58,0.95));
const sun=new THREE.DirectionalLight(0xffd7a6,0.75);sun.position.set(-200,300,120);scene.add(sun);

/* ground and roads */
const grass=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:0x6f8f55}));
grass.position.y=-0.05;scene.add(grass);
const asphalt=new THREE.Mesh(new THREE.PlaneGeometry(N*B+R,N*B+R).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:0x3a3e44}));
scene.add(asphalt);

/* blocks, buildings, trees */
const blocks=new Array(N*N);
const classH=[14,28,52];
const spots=[[],[],[]];const trees=[];
const padMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(PAD,0.3,PAD),new THREE.MeshLambertMaterial({color:0xffffff}),N*N);
const m4=new THREE.Matrix4(),tmpC=new THREE.Color();
const palette=[0xd9c7a8,0xc9d3d8,0xe3b9a0,0xb8c4b0,0xd8d2c8,0xa9b8c9,0xe8cf9b,0xcdb4a6];
const parks=[];
for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  const cx=-HALF+(i+.5)*B,cz=-HALF+(j+.5)*B,idx=i*N+j;
  const park=((i*3+j*5)%7===0);
  padMesh.setMatrixAt(idx,m4.makeTranslation(cx,0.15,cz));
  padMesh.setColorAt(idx,tmpC.set(park?0x6f9a55:0xb9b6ae));
  const bl={aabb:[],circ:[]};blocks[idx]=bl;
  if(park){
    parks.push([cx,cz]);
    for(let t=0;t<9;t++){const x=cx+(rand()-.5)*42,z=cz+(rand()-.5)*42;trees.push([x,z,.9+rand()*.7]);bl.circ.push({x,z,r:1});}
  }else{
    for(const sx of[-1,1])for(const sz of[-1,1]){
      const r=rand(),cls=r<.4?0:r<.8?1:2,s=.85+rand()*.15;
      const x=cx+sx*12.5,z=cz+sz*12.5;
      spots[cls].push({x,z,s,c:palette[(rand()*palette.length)|0]});
      bl.aabb.push({x0:x-11*s,x1:x+11*s,z0:z-11*s,z1:z+11*s});
    }
  }
}
scene.add(padMesh);
function winTex(){
  const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  g.fillStyle='#ffffff';g.fillRect(0,0,64,64);g.fillStyle='#4a5a70';
  for(let y=0;y<2;y++)for(let x=0;x<2;x++)g.fillRect(6+x*32,7+y*32,20,19);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t;
}
const baseTex=winTex(),dummy=new THREE.Object3D();
for(let k=0;k<3;k++){
  const list=spots[k];if(!list.length)continue;
  const h=classH[k],tex=baseTex.clone();tex.needsUpdate=true;tex.repeat.set(3,h/6.4);
  const side=new THREE.MeshLambertMaterial({color:0xffffff,map:tex});
  const roof=new THREE.MeshLambertMaterial({color:0xcfcfcf});
  const mesh=new THREE.InstancedMesh(new THREE.BoxGeometry(22,h,22),[side,side,roof,roof,side,side],list.length);
  list.forEach((p,n)=>{
    dummy.position.set(p.x,h/2+.3,p.z);dummy.scale.set(p.s,1,p.s);dummy.rotation.set(0,0,0);dummy.updateMatrix();
    mesh.setMatrixAt(n,dummy.matrix);mesh.setColorAt(n,tmpC.set(p.c));
  });
  scene.add(mesh);
}
if(trees.length){
  const trunk=new THREE.InstancedMesh(new THREE.CylinderGeometry(.35,.45,3,6),new THREE.MeshLambertMaterial({color:0x6b4a2e}),trees.length);
  const crown=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(2.3,0),new THREE.MeshLambertMaterial({color:0xffffff}),trees.length);
  trees.forEach((t,n)=>{
    dummy.rotation.set(0,0,0);dummy.scale.set(t[2],t[2],t[2]);
    dummy.position.set(t[0],1.8,t[1]);dummy.updateMatrix();trunk.setMatrixAt(n,dummy.matrix);
    dummy.position.set(t[0],4.6*t[2],t[1]);dummy.updateMatrix();crown.setMatrixAt(n,dummy.matrix);
    crown.setColorAt(n,tmpC.setHSL(.27+rand()*.06,.45,.3+rand()*.1));
  });
  scene.add(trunk);scene.add(crown);
}

/* lane dashes */
(function(){
  const pts=[];
  for(let r=0;r<=N;r++){
    const c=-HALF+r*B;
    for(let t=-HALF;t<=HALF;t+=8){
      const m=((t+HALF)%B+B)%B,d=Math.min(m,B-m);
      if(d<R/2+2)continue;
      pts.push([c,t,0]);pts.push([t,c,1]);
    }
  }
  const mesh=new THREE.InstancedMesh(new THREE.BoxGeometry(.3,.04,3.2),new THREE.MeshBasicMaterial({color:0xe6c84a}),pts.length);
  pts.forEach((p,n)=>{dummy.position.set(p[0],.05,p[1]);dummy.scale.set(1,1,1);dummy.rotation.set(0,p[2]?Math.PI/2:0,0);dummy.updateMatrix();mesh.setMatrixAt(n,dummy.matrix);});
  scene.add(mesh);
})();

/* collision */
function blockAt(i,j){return(i<0||j<0||i>=N||j>=N)?null:blocks[i*N+j];}
function collide(p,r){
  let push=0;
  const bi=Math.floor((p.x+HALF)/B),bj=Math.floor((p.z+HALF)/B);
  for(let i=bi-1;i<=bi+1;i++)for(let j=bj-1;j<=bj+1;j++){
    const bl=blockAt(i,j);if(!bl)continue;
    for(const a of bl.aabb){
      const qx=clamp(p.x,a.x0,a.x1),qz=clamp(p.z,a.z0,a.z1);
      const dx=p.x-qx,dz=p.z-qz,d2=dx*dx+dz*dz;
      if(d2<r*r){
        if(d2>1e-6){const d=Math.sqrt(d2),pu=r-d;p.x+=dx/d*pu;p.z+=dz/d*pu;push+=pu;}
        else{p.x=a.x0-r;push+=r;}
      }
    }
    for(const c of bl.circ){
      const dx=p.x-c.x,dz=p.z-c.z,rr=r+c.r,d2=dx*dx+dz*dz;
      if(d2<rr*rr){const d=Math.sqrt(d2)||.01,pu=rr-d;p.x+=dx/d*pu;p.z+=dz/d*pu;push+=pu;}
    }
  }
  return push;
}

/* traffic */
const carColors=[0xf4f1ea,0x3c6e9e,0xb83a3a,0x2f2f33,0xd9a441,0x5d8a62,0x8e8e96];
function makeCar(color){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.9,.9,4.2),new THREE.MeshLambertMaterial({color}));body.position.y=.8;g.add(body);
  const cab=new THREE.Mesh(new THREE.BoxGeometry(1.7,.75,2.2),new THREE.MeshLambertMaterial({color:0x26323f}));cab.position.set(0,1.6,-.2);g.add(cab);
  const tyre=new THREE.MeshLambertMaterial({color:0x111111});
  for(const x of[-.95,.95])for(const z of[-1.3,1.3]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.3,8).rotateZ(Math.PI/2),tyre);w.position.set(x,.4,z);g.add(w);}
  return g;
}
const LIM=HALF+40,cars=[];
for(let k=0;k<18;k++){
  const mesh=makeCar(carColors[k%carColors.length]);scene.add(mesh);
  cars.push({mesh,axis:k%2,road:1+Math.floor(Math.random()*(N-1)),dir:Math.random()<.5?-1:1,t:rnd(-HALF,HALF),sp:rnd(7,13),stun:0,x:0,z:0});
}
function placeCar(c){
  const line=-HALF+c.road*B;
  if(c.axis===0){c.x=c.t;c.z=line+c.dir*4.5;c.mesh.rotation.y=c.dir>0?Math.PI/2:-Math.PI/2;}
  else{c.z=c.t;c.x=line-c.dir*4.5;c.mesh.rotation.y=c.dir>0?0:Math.PI;}
  c.mesh.position.set(c.x,0,c.z);
}
cars.forEach(placeCar);

/* bus stops */
const stops=[];
function makeStop(){
  const g=new THREE.Group();
  const ring=new THREE.Mesh(new THREE.TorusGeometry(5.5,.4,6,28).rotateX(Math.PI/2),new THREE.MeshBasicMaterial({color:0xf2a900,fog:false}));ring.position.y=.3;g.add(ring);
  const beam=new THREE.Mesh(new THREE.CylinderGeometry(5.3,5.3,34,20,1,true),new THREE.MeshBasicMaterial({color:0xffc83d,transparent:true,opacity:.2,depthWrite:false,side:THREE.DoubleSide,fog:false}));beam.position.y=17;g.add(beam);
  const post=new THREE.Mesh(new THREE.BoxGeometry(.25,4.5,.25),new THREE.MeshLambertMaterial({color:0x444444}));post.position.set(7.5,2.25,0);g.add(post);
  const sign=new THREE.Mesh(new THREE.BoxGeometry(1.8,1.4,.15),new THREE.MeshLambertMaterial({color:0x0b6b4f}));sign.position.set(7.5,4.6,0);sign.rotation.y=Math.PI/2;g.add(sign);
  g.userData={ring,beam};scene.add(g);return g;
}
function relocate(s){
  const axis=Math.random()<.5?0:1,road=Math.floor(Math.random()*(N+1)),k=Math.floor(Math.random()*N);
  const t=-HALF+(k+.5)*B+rnd(-10,10),line=-HALF+road*B;
  s.x=axis?line:t;s.z=axis?t:line;s.mesh.position.set(s.x,0,s.z);
}
for(let k=0;k<5;k++){const s={mesh:makeStop(),x:0,z:0};relocate(s);stops.push(s);}

/* bus model: forward is +Z, heading h gives forward (sin h, cos h) */
const busG=new THREE.Group();scene.add(busG);
function box(w,h,d,color,x,y,z,basic){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),basic?new THREE.MeshBasicMaterial({color}):new THREE.MeshLambertMaterial({color}));
  m.position.set(x,y,z);busG.add(m);return m;
}
box(2.6,1.3,10.8,0xe4572e,0,1.35,0);
box(2.6,1.5,10.8,0xf3e3b8,0,2.75,0);
box(2.64,.9,9.4,0x1f2b38,0,2.85,-.2);
box(2.3,1.05,.06,0x1f2b38,0,2.8,5.42);
box(2.4,.15,9.6,0xb9b9b9,0,3.58,-.3);
box(1.1,.3,1.6,0x9a9a9a,0,3.78,-2.5);
box(1.7,.32,.06,0x9dff7a,0,3.3,5.43,true);
for(const x of[-.9,.9])box(.5,.3,.08,0xfff2b0,x,1.25,5.42,true);
const tailMat=new THREE.MeshBasicMaterial({color:0x7a1010});
for(const x of[-1,1]){const t=new THREE.Mesh(new THREE.BoxGeometry(.4,.3,.08),tailMat);t.position.set(x,1.4,-5.42);busG.add(t);}
box(2.66,.2,10.9,0x2a2a2a,0,.78,0);
const tyreMat=new THREE.MeshLambertMaterial({color:0x151515}),hubMat=new THREE.MeshLambertMaterial({color:0xbbbbbb});
const wheels=[];
for(const wz of[3.6,-3.4])for(const wx of[-1.35,1.35]){
  const piv=new THREE.Group();piv.position.set(wx,.55,wz);busG.add(piv);
  const w=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.4,14).rotateZ(Math.PI/2),tyreMat);piv.add(w);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.42,8).rotateZ(Math.PI/2),hubMat);w.add(hub);
  wheels.push({piv,w,front:wz>0});
}
const blob=new THREE.Mesh(new THREE.PlaneGeometry(3.6,12).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.25,depthWrite:false}));
blob.position.y=.07;busG.add(blob);

/* state */
const bus={x:0,z:0,h:0,v:0,steer:0};
const inp={gas:0,brake:0,left:0,right:0,horn:0},kb={gas:0,brake:0,left:0,right:0,horn:0};
let running=false,camMode=0,camAng=0,shake=0,bumpCd=0,pax=0,fare=0,lastNx='';
const camNames=['Chase','Driver','High'];

/* audio */
const audio={ctx:null,eng:null,g:null,hg:null,ho:[],muted:false,
  init(){
    if(this.ctx)return;
    try{
      const C=window.AudioContext||window.webkitAudioContext;this.ctx=new C();
      const o=this.ctx.createOscillator();o.type='sawtooth';
      const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=360;
      const g=this.ctx.createGain();g.gain.value=0;
      o.connect(f);f.connect(g);g.connect(this.ctx.destination);o.start();this.eng=o;this.g=g;
    }catch(e){this.ctx=null;}
  },
  update(v,th){
    if(!this.ctx)return;const t=this.ctx.currentTime;
    this.eng.frequency.setTargetAtTime(36+Math.abs(v)*2.6+th*16,t,.12);
    this.g.gain.setTargetAtTime(this.muted?0:.05+.03*th,t,.12);
  },
  hornOn(){
    if(!this.ctx||this.muted||this.ho.length)return;
    const g=this.ctx.createGain();g.gain.value=.07;g.connect(this.ctx.destination);
    for(const fr of[349,440]){const o=this.ctx.createOscillator();o.type='square';o.frequency.value=fr;o.connect(g);o.start();this.ho.push(o);}
    this.hg=g;
  },
  hornOff(){this.ho.forEach(o=>{try{o.stop();}catch(e){}});this.ho=[];if(this.hg){this.hg.disconnect();this.hg=null;}}
};

/* input */
document.querySelectorAll('[data-k]').forEach(el=>{
  const k=el.dataset.k;
  el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(x){}inp[k]=1;el.classList.add('down');if(k==='horn')audio.hornOn();});
  const up=()=>{inp[k]=0;el.classList.remove('down');if(k==='horn')audio.hornOff();};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);
  el.addEventListener('contextmenu',e=>e.preventDefault());
});
const keyMap={ArrowUp:'gas',w:'gas',W:'gas',ArrowDown:'brake',s:'brake',S:'brake',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',' ':'horn',h:'horn',H:'horn'};
window.addEventListener('keydown',e=>{
  const k=keyMap[e.key];
  if(k){e.preventDefault();if(!kb[k]){kb[k]=1;if(k==='horn')audio.hornOn();}}
  else if(e.key==='c'||e.key==='C')cycleCam();
  else if(e.key==='r'||e.key==='R')resetBus();
});
window.addEventListener('keyup',e=>{const k=keyMap[e.key];if(k){kb[k]=0;if(k==='horn')audio.hornOff();}});
const down=k=>(inp[k]||kb[k])?1:0;

/* ui */
const el={spd:$('spd'),gear:$('gear'),pax:$('pax'),rs:$('rs'),nx:$('nx'),toast:$('toast'),view:$('bView'),snd:$('bSnd')};
let toastT=0;
function toast(m){el.toast.textContent=m;el.toast.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.toast.classList.remove('on'),1800);}
function cycleCam(){
  camMode=(camMode+1)%3;camera.fov=camMode===1?74:62;camera.updateProjectionMatrix();
  el.view.textContent='View: '+camNames[camMode];
}
function resetBus(){
  bus.x=Math.round((bus.x+HALF)/B)*B-HALF;bus.z=Math.round((bus.z+HALF)/B)*B-HALF;
  bus.x=clamp(bus.x,-HALF,HALF);bus.z=clamp(bus.z,-HALF,HALF);
  bus.h=Math.round(bus.h/(Math.PI/2))*(Math.PI/2);bus.v=0;bus.steer=0;camAng=bus.h;
  toast('Back on the road');
}
el.view.addEventListener('click',cycleCam);
$('bRst').addEventListener('click',resetBus);
el.snd.addEventListener('click',()=>{audio.muted=!audio.muted;el.snd.textContent='Sound: '+(audio.muted?'Off':'On');if(audio.muted)audio.hornOff();});
$('goBtn').addEventListener('click',()=>{audio.init();if(audio.ctx&&audio.ctx.state==='suspended')audio.ctx.resume();$('start').hidden=true;running=true;});
document.addEventListener('visibilitychange',()=>{if(document.hidden)audio.hornOff();});

/* minimap */
const mini=$('mini'),mg=mini.getContext('2d'),MS=mini.width/(N*B+60);
const mbg=document.createElement('canvas');mbg.width=mini.width;mbg.height=mini.height;
(function(){
  const g=mbg.getContext('2d'),o=30;
  g.fillStyle='#3f5a35';g.fillRect(0,0,mbg.width,mbg.height);
  g.fillStyle='#4a4f57';g.fillRect((o-R/2)*MS,(o-R/2)*MS,(N*B+R)*MS,(N*B+R)*MS);
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    const park=blocks[i*N+j].circ.length>0;
    g.fillStyle=park?'#5f8a4a':'#8d8a83';
    g.fillRect(((i+.5)*B+o-PAD/2)*MS,((j+.5)*B+o-PAD/2)*MS,PAD*MS,PAD*MS);
  }
})();
function drawMini(){
  mg.drawImage(mbg,0,0);
  const o=30;
  for(const s of stops){mg.fillStyle='#f2a900';mg.beginPath();mg.arc((s.x+HALF+o)*MS,(s.z+HALF+o)*MS,4,0,6.283);mg.fill();}
  const px=(bus.x+HALF+o)*MS,pz=(bus.z+HALF+o)*MS,fx=Math.sin(bus.h),fz=Math.cos(bus.h);
  mg.fillStyle='#ff5a36';mg.strokeStyle='#fff';mg.lineWidth=1.5;mg.beginPath();
  mg.moveTo(px+fx*10,pz+fz*10);mg.lineTo(px-fx*6-fz*6,pz-fz*6+fx*6);mg.lineTo(px-fx*6+fz*6,pz-fz*6-fx*6);mg.closePath();mg.fill();mg.stroke();
}

/* physics */
const L=6.2,VMAX=30,circles=[-4,0,4],tmp={x:0,z:0};
function update(dt){
  const gas=down('gas'),brake=down('brake'),st=down('right')-down('left');
  let a=0;
  if(gas){a=(bus.v<-.3)?18:7.5*(1-Math.max(0,bus.v)/VMAX);}
  else if(brake){a=bus.v>.3?-19:(bus.v>-.3?-5:-5*(1+bus.v/7));}
  else{a=-Math.sign(bus.v)*(1.2+Math.abs(bus.v)*.06);}
  const nv=bus.v+a*dt;
  bus.v=(!gas&&!brake&&Math.sign(nv)!==Math.sign(bus.v))?0:nv;
  bus.v=clamp(bus.v,-7,VMAX);
  const maxS=.62-.42*clamp(Math.abs(bus.v)/VMAX,0,1);
  const tgt=st*maxS;bus.steer+=(tgt-bus.steer)*Math.min(1,(st?5:8)*dt);
  bus.h-=bus.v/L*Math.tan(bus.steer)*dt;
  const fx=Math.sin(bus.h),fz=Math.cos(bus.h);
  bus.x+=fx*bus.v*dt;bus.z+=fz*bus.v*dt;
  /* buildings and trees */
  let impact=0,cx=0,cz=0;
  for(const o of circles){
    tmp.x=bus.x+fx*o;tmp.z=bus.z+fz*o;const ox=tmp.x,oz=tmp.z;
    impact+=collide(tmp,1.4);cx+=tmp.x-ox;cz+=tmp.z-oz;
  }
  bus.x+=cx;bus.z+=cz;
  if(impact>.02){
    bus.v*=Math.max(.2,1-impact*.5);
    if(impact>.5&&Math.abs(bus.v)>4&&bumpCd<=0){shake=.8;bumpCd=.8;toast('Careful!');}
  }
  const E=HALF+R/2-2;
  if(Math.abs(bus.x)>E){bus.x=clamp(bus.x,-E,E);bus.v*=.6;}
  if(Math.abs(bus.z)>E){bus.z=clamp(bus.z,-E,E);bus.v*=.6;}
  bumpCd-=dt;
  /* traffic */
  for(const c of cars){
    if(c.stun>0)c.stun-=dt;else{c.t+=c.dir*c.sp*dt;if(c.t>LIM)c.t=-LIM;else if(c.t<-LIM)c.t=LIM;}
    placeCar(c);
    for(const o of circles){
      const px=bus.x+fx*o,pz=bus.z+fz*o,dx=c.x-px,dz=c.z-pz,d=Math.hypot(dx,dz);
      if(d<2.9){
        if(c.stun<=0&&bumpCd<=0&&Math.abs(bus.v)>2){bus.v*=.6;shake=.6;bumpCd=.6;toast('Bump!');}
        c.stun=2;
        const s=(c.axis===0?dx:dz)>=0?1:-1;c.t+=s*Math.min(1.5,(2.9-d)*.5+.2);
        const pu=(2.9-d)*.5/(d||1);bus.x-=dx*pu;bus.z-=dz*pu;
      }
    }
  }
  /* stops */
  let best=1e9;
  for(const s of stops){
    const d=Math.hypot(s.x-bus.x,s.z-bus.z);if(d<best)best=d;
    if(d<7&&Math.abs(bus.v)<5){
      const n=4+Math.floor(Math.random()*11);pax+=n;fare+=n*60;
      toast('+'+n+' passengers  Rs '+(n*60));relocate(s);
    }
  }
  const nx=Math.round(best)+' m';if(nx!==lastNx){el.nx.textContent=nx;lastNx=nx;}
  /* visuals */
  busG.position.set(bus.x,0,bus.z);busG.rotation.y=bus.h;
  const spin=bus.v*dt/.55;
  for(const w of wheels){w.w.rotation.x+=spin;if(w.front)w.piv.rotation.y=-bus.steer*.9;}
  tailMat.color.setHex(brake&&bus.v>.3?0xff2a2a:0x7a1010);
  audio.update(bus.v,gas);
}

/* camera */
function updateCamera(dt,t){
  const dA=Math.atan2(Math.sin(bus.h-camAng),Math.cos(bus.h-camAng));
  camAng+=dA*Math.min(1,dt*(camMode===0?3.2:6));
  const f=camMode===1?bus.h:camAng,fx=Math.sin(f),fz=Math.cos(f);
  let px,py,pz,lx,ly,lz;
  if(camMode===1){
    const rx=-Math.cos(bus.h),rz=Math.sin(bus.h);
    px=bus.x+Math.sin(bus.h)*4.3+rx*.8;pz=bus.z+Math.cos(bus.h)*4.3+rz*.8;py=3.5;
    lx=px+fx*20;lz=pz+fz*20;ly=2.7;
  }else{
    const dist=camMode===0?16:24,hgt=camMode===0?6.5:15;
    px=bus.x-fx*dist;pz=bus.z-fz*dist;py=hgt;
    lx=bus.x+fx*9;lz=bus.z+fz*9;ly=camMode===0?2:0;
  }
  if(shake>.01){px+=(Math.random()-.5)*shake;py+=(Math.random()-.5)*shake;shake*=Math.exp(-dt*6);}
  camera.position.set(px,py,pz);camera.lookAt(lx,ly,lz);
}

/* loop */
let last=performance.now(),idle=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(running)update(dt);
  else{
    idle+=dt;busG.position.set(bus.x,0,bus.z);
    camera.position.set(Math.sin(idle*.2)*30,9,-Math.cos(idle*.2)*30-6);camera.lookAt(0,2,0);
  }
  for(const s of stops){const u=s.mesh.userData;u.ring.scale.setScalar(1+.08*Math.sin(now*.005));u.ring.rotation.y+=dt;}
  if(running)updateCamera(dt,now);
  const kmh=Math.round(Math.abs(bus.v)*3.6);
  if(el.spd.textContent!==String(kmh))el.spd.textContent=kmh;
  const gr=bus.v<-.3?'R':(Math.abs(bus.v)<.3?'N':'D');
  if(el.gear.textContent!==gr)el.gear.textContent=gr;
  if(el.pax.textContent!==String(pax)){el.pax.textContent=pax;el.rs.textContent=fare;}
  drawMini();
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
})();
</script>

</body>
